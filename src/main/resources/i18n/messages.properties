home.about.title2=SDUST
home.about.text=Founded in 1951, Shandong University of Science and Technology (SDUST) is a key university in Shandong Province known for its distinctive training of application-oriented talent with a solid academic foundation. It has outstanding strengths in engineering and distinctive industry features, and offers multidisciplinary education across engineering, science, management, literature, law, economics, arts, and education, with these disciplines interconnected and developing in a coordinated way. It is also a high-level university in Shandong Province’s “Striving for First-Class” construction program.
home.about.btn=Academics &amp; Research
home.cta.title=Start Your Journey at SDUST
home.cta.text=Join more than 40,000 students building their future in science and technology.

