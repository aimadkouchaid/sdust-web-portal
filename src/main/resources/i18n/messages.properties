ar.teach.text=More than 28,700 full-time undergraduates and 11,600 graduate students study at SDUST. Our programs combine strong engineering foundations with practical training in labs and industry.
ar.teach.li1=26 national first-class undergraduate major construction points
ar.teach.li2=19 majors accredited through engineering education certification
ar.teach.li3=43 national first-class undergraduate courses
ar.teach.li4=8 disciplines in the ESI global top 1%, three of them in the top 0.1%
