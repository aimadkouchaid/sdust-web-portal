campus.sea.alt=SDUST Qingdao campus
campus.sea.title1=Life by the
campus.sea.title2=Sea
campus.sea.p1=Our main campus sits in the Huangdao District of Qingdao, on the West Coast New Area, just minutes from the shoreline. Tree-lined avenues, lakeside paths and open sports grounds make it a place where studying and living feel naturally connected.
campus.sea.p2=Qingdao itself is one of China's most livable coastal cities — famous for its beaches, mild summers, fresh seafood and a lively mix of tradition and modern culture, all within easy reach on weekends.
campus.life.title1=Everything You Need,
campus.life.title2=On Campus
campus.clubs.title=Student Clubs
campus.clubs.text=Hundreds of student associations covering robotics, programming, music, dance, photography, debate, volunteering and more.
campus.sports.title=Sports &amp; Fitness
campus.sports.text=Track fields, basketball and tennis courts, a swimming pool and gyms, plus an annual university sports meet and inter-college leagues.
campus.housing.title=Student Housing
campus.housing.text=On-campus residence halls with study rooms, laundry, hot water and Wi-Fi, a short walk from classrooms, canteens and libraries.
campus.dining.title=Dining
campus.dining.text=Multiple canteens serving affordable dishes from across China, along with halal options, cafés and late-night snacks.
campus.library.title=Library &amp; Study
campus.library.text=Modern libraries with quiet reading rooms, group study spaces and extensive digital resources, open late during exam season.
campus.health.title=Health &amp; Support
campus.health.text=A campus clinic, psychological counseling, and dedicated counselors for every college to support students' well-being.
