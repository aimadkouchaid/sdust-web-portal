news.list.title2=News
news.ann.title1=Public
news.ann.title2=Announcements
news.1.text=The new smart library on the Qingdao campus opens with self-service borrowing, bookable study rooms and seats for more than 3,000 readers. It stays open until 23:00 during the exam weeks.
news.2.text=A student team from the mining engineering program won a national innovation award for a sensor network that monitors roof pressure in deep mines in real time.
news.3.text=Students from 40 countries shared food, music and traditions during the College of International Exchange’s annual Cultural Exchange Week on the Qingdao campus.
news.4.text=Five new undergraduate programs will admit their first students in 2027, with a focus on intelligent manufacturing, data science and marine engineering.
news.5.text=This year’s Science and Technology Festival drew a record crowd to hands-on workshops, robot demonstrations and talks by researchers from across the university.
news.6.text=The university robotics club qualified for the national finals after placing first in the provincial round with an autonomous inspection robot.
news.7.text=Students and staff planted 2,000 trees along the campus paths as part of the Green Campus Initiative, which also adds new recycling points in every dormitory.
news.8.text=A faculty team published a study on low-cost catalysts for hydrogen production, a step towards cleaner energy for industrial use.
news.9.text=Alumni working in engineering companies across China returned to campus to mentor final-year students on careers, interviews and graduate study.
news.10.text=SDUST signed new cooperation agreements with partner universities in Europe, opening more places for student exchange and joint research.
news.11.text=More than 300 employers met students at the annual career fair, offering internships and graduate positions in engineering, IT, finance and education.
news.12.text=The university’s AI lab presented a safety system that uses cameras and machine learning to spot hazards underground and warn miners before accidents happen.
