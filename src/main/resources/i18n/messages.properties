ad.prog.1.title=Bachelor’s degrees
ad.prog.1.text=73 undergraduate majors in engineering, science, management, literature, law, economics, arts and education, from Mining Engineering and Geomatics to Robot Engineering and Finance.
ad.prog.2.title=Master’s degrees
ad.prog.2.text=33 first-level disciplines and 23 professional degree categories, with supervisors listed by each college.
ad.prog.3.title=Doctoral degrees
ad.prog.3.text=11 first-level disciplines and one professional doctoral category, supported by 10 postdoctoral research stations.
ad.prog.4.title=Chinese Language Program
ad.prog.4.text=Long-term Chinese courses at beginner, intermediate and advanced levels with HSK preparation. You study at least one semester and receive a certificate.
ad.prog.5.title=Short-term programs
ad.prog.5.text=Winter and summer programs from a couple of weeks to a couple of months, with a Certificate of Completion from the College of International Exchange.
ad.prog.6.title=Exchange and double degree
ad.prog.6.text=Double Degree Undergraduate Program, Mobility Study Program and a pre-undergraduate (preparatory) program with our 130+ partner institutions.
ad.cn.alt=International students in a Chinese class
ad.cn.title1=Two semesters
ad.cn.title2=a year
ad.cn.text=Each level lasts one year in two semesters. Over the past decade, more than 1,000 long-term and 800 short-term language students have studied Chinese at SDUST.
ad.cn.li1=Spring semester: early March to early July
ad.cn.li2=Autumn semester: early September to early January
ad.cn.li3=Apply for at least one semester
ad.apply.title1=How to
ad.apply.title2=Apply
ad.step1.label=Step 1
ad.step1.title=Choose a program
ad.step1.text=Pick a degree, the Chinese Language Program or a short-term program above, and check the details for the coming intake with the College of International Exchange.
ad.step2.label=Step 2
ad.step2.title=Apply online
ad.step2.text=Create an account and submit your application in the International Students Management System.
ad.step3.label=Step 3
ad.step3.title=Send your documents
ad.step3.text=Requirements, documents, fees and scholarships are published by the College of International Exchange each year. Email the admissions office if anything is unclear.
ad.step4.label=Step 4
ad.step4.title=Receive your result
ad.step4.text=The College of International Exchange reviews your application and contacts you about admission and your arrival in Qingdao.
