ar.res.title1=Research
ar.res.title2=Strengths
ar.res.text=SDUST runs a key laboratory co-founded by Shandong Province and the Ministry of Education, a state-local joint engineering research center and dozens of ministerial and provincial key labs and engineering centers, with research rooted in mining, safety, geomatics, robotics and materials.
ar.lab.1.title=Mine disaster prevention
ar.lab.1.text=The Laboratory of Mine Disaster Prevention and Control is a key laboratory of the Ministry of Education co-sponsored by Shandong Province.
ar.lab.2.title=Robotics and intelligent control
ar.lab.2.text=The Shandong Key Laboratory of Robot Intelligence Technology and Qingdao’s Key Laboratory of Intelligence Control and Robot Technology lead our robotics research.
ar.lab.3.title=Deep mining and safety
ar.lab.3.text=Shandong key labs for Safety Deep Mining, Mine Pressure, and Mining Safety Engineering and Environmental Protection study safer, cleaner mining.
ar.lab.4.title=Geoinformation and surveying
ar.lab.4.text=The Shandong Key Laboratory of Fundamental Geographic Information and Digital Technology and the Laboratory of Mining Surveying build on our strength in geomatics.
ar.lab.5.title=Materials and machinery
ar.lab.5.text=Key labs for Microcrystal Strengthened Engineering Material, Mining Machinery Engineering, and Bulk Solids Handling connect research with industry.
ar.lab.6.title=International cooperation
ar.lab.6.text=The Russian Academy of Natural Sciences set up its only China Science Center at SDUST, alongside the Shandong-Russia Center of Sci-Tech Cooperation.
