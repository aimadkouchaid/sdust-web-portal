campus.sea.alt=山东科技大学青岛校区
campus.sea.title1=依海而居的
campus.sea.title2=校园
campus.sea.p1=主校区位于青岛西海岸新区黄岛区，距海岸仅几分钟路程。林荫大道、湖畔小径和开阔的运动场地，让学习与生活自然地融为一体。
campus.sea.p2=青岛是中国最宜居的海滨城市之一，以海滩、凉爽的夏季、新鲜的海鲜以及传统与现代交融的城市文化而闻名，周末出行十分便利。
campus.life.title1=所需一切，
campus.life.title2=尽在校园
campus.clubs.title=学生社团
campus.clubs.text=数百个学生社团，涵盖机器人、编程、音乐、舞蹈、摄影、辩论、志愿服务等领域。
campus.sports.title=体育健身
campus.sports.text=田径场、篮球场、网球场、游泳馆和健身房一应俱全，每年还举办校运动会和院系联赛。
campus.housing.title=学生公寓
campus.housing.text=校内学生公寓配有自习室、洗衣房、热水和无线网络，步行即可到达教学楼、食堂和图书馆。
campus.dining.title=餐饮服务
campus.dining.text=多个食堂提供价格实惠的各地风味菜肴，另设清真餐厅、咖啡馆和夜宵。
campus.library.title=图书馆与自习
campus.library.text=现代化图书馆设有安静的阅览室、小组学习空间和丰富的数字资源，考试期间延长开放时间。
campus.health.title=健康与支持
campus.health.text=校医院、心理咨询中心以及各学院专职辅导员，全方位关心学生的身心健康。
