ar.res.title1=科研
ar.res.title2=特色
ar.res.text=学校建有省部共建教育部重点实验室、国家地方联合工程研究中心以及数十个省部级重点实验室和工程技术研究中心，研究特色集中在矿业、安全、测绘、机器人和材料等领域。
ar.lab.1.title=矿山灾害预防与控制
ar.lab.1.text=矿山灾害预防控制实验室是省部共建教育部重点实验室。
ar.lab.2.title=机器人与智能控制
ar.lab.2.text=山东省机器人智能技术重点实验室和青岛市智能控制与机器人技术重点实验室引领学校的机器人研究。
ar.lab.3.title=深部开采与安全
ar.lab.3.text=山东省深部开采安全、矿山压力、矿山安全工程与环境保护等重点实验室致力于更安全、更绿色的开采。
ar.lab.4.title=地理信息与测绘
ar.lab.4.text=山东省基础地理信息与数字化技术重点实验室和矿山测量实验室依托学校测绘学科优势开展研究。
ar.lab.5.title=材料与机械
ar.lab.5.text=微晶强化工程材料、矿山机械工程、散体物料输送等重点实验室推动科研与产业相结合。
ar.lab.6.title=国际合作
ar.lab.6.text=俄罗斯自然科学院在我校设立了其在中国唯一的中国科学中心，学校还建有山东—俄罗斯科技合作中心。
