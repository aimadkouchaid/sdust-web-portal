ar.teach.alt=山东科技大学的学生在教室上课
ar.teach.title1=高质量的
ar.teach.title2=本科教学
ar.teach.text=学校现有全日制本科生 28,700 余人、研究生 11,600 余人。人才培养注重扎实的工科基础与实验室、企业中的实践训练相结合。
ar.teach.li1=26 个国家级一流本科专业建设点
ar.teach.li2=19 个专业通过工程教育专业认证
ar.teach.li3=43 门国家级一流本科课程
ar.teach.li4=8 个学科进入 ESI 全球前 1%，其中 3 个进入前 0.1%
