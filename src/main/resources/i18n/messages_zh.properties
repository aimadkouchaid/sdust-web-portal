news.list.title1=最新
news.list.title2=新闻
news.ann.title1=公开
news.ann.title2=公告
news.1.text=青岛校区新建的智慧图书馆正式开放，提供自助借还、可预约研讨室和 3000 余个阅览座位，考试周期间开放至 23:00。
news.2.text=采矿工程专业的学生团队凭借一套实时监测深部矿井顶板压力的传感网络，获得全国创新奖项。
news.3.text=在国际交流学院一年一度的文化交流周上，来自 40 个国家的学生在青岛校区分享美食、音乐和传统文化。
news.4.text=五个新的本科专业将于 2027 年首次招生，重点方向为智能制造、数据科学和海洋工程。
news.5.text=今年的科技节吸引了创纪录的参与人数，活动包括动手工作坊、机器人展示和全校研究人员的讲座。
news.6.text=学校机器人社团凭借一款自主巡检机器人在省赛中获得第一名，晋级全国总决赛。
news.7.text=作为绿色校园计划的一部分，师生在校园道路两旁种植了 2000 棵树，并在每栋宿舍楼新增了回收点。
news.8.text=学校教师团队发表了一项关于低成本制氢催化剂的研究，为工业清洁能源的应用迈出了一步。
news.9.text=在全国各地工程企业工作的校友回到校园，就职业发展、面试和研究生深造为毕业班学生提供指导。
news.10.text=学校与欧洲多所合作高校签署新的合作协议，为学生交流和联合研究提供更多机会。
news.11.text=300 多家用人单位参加了年度招聘会，为学生提供工程、信息技术、金融和教育等领域的实习和就业岗位。
news.12.text=学校人工智能实验室发布了一套安全系统，利用摄像头和机器学习识别井下隐患，在事故发生前向矿工发出预警。
