home.about.text=山东科技大学始建于1951年，是山东省重点建设的大学，以培养基础扎实的应用型人才为特色。学校工科优势突出、行业特色鲜明，工、理、管、文、法、经、艺、教等多学科相互渗透、协调发展，是山东省“高水平大学‘冲一流’建设”高校。
