ad.prog.title2=项目
ad.prog.1.title=本科
ad.prog.1.text=73 个本科专业，涵盖工、理、管、文、法、经、艺、教等学科，从采矿工程、测绘工程到机器人工程、金融学。
ad.prog.2.title=硕士研究生
ad.prog.2.text=33 个硕士学位授权一级学科和 23 个专业学位类别，导师信息见各学院网站。
ad.prog.3.title=博士研究生
ad.prog.3.text=11 个博士学位授权一级学科和 1 个博士专业学位类别，并设有 10 个博士后科研流动站。
ad.prog.4.title=汉语进修项目
ad.prog.4.text=初、中、高级长期汉语课程，含 HSK 辅导。学习时间至少一个学期，结业颁发进修证书。
ad.prog.5.title=短期项目
ad.prog.5.text=寒暑期短期项目，时长从几周到几个月不等，结业颁发国际交流学院结业证书。
ad.prog.6.title=交流与双学位
ad.prog.6.text=与 130 余所合作院校开展本科双学位项目、交换学习项目和本科预科项目。
ad.cn.alt=国际学生在上汉语课
ad.cn.title1=一年两个
ad.cn.title2=学期
ad.cn.text=每个级别学习一年，分两个学期。近十年来，学校累计接收长期语言进修生 1000 余人、短期进修生 800 余人。
ad.cn.li1=春季学期：3 月初至 7 月初
ad.cn.li2=秋季学期：9 月初至次年 1 月初
ad.cn.li3=至少申请学习一个学期
ad.apply.title1=如何
ad.apply.title2=申请
ad.step1.label=第一步
ad.step1.title=选择项目
ad.step1.text=从上方选择学位项目、汉语进修项目或短期项目，并向国际交流学院了解下一批次的具体信息。
ad.step2.label=第二步
ad.step2.title=在线申请
ad.step2.text=在国际学生管理系统中注册账号并提交申请。
ad.step3.label=第三步
ad.step3.title=提交材料
ad.step3.text=申请条件、所需材料、费用和奖学金信息由国际交流学院每年公布，如有疑问请发邮件咨询招生办公室。
ad.step4.label=第四步
ad.step4.title=获取结果
